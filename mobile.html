<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0f14">
<title>Anno — Truck Console</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{
  --bg:#0b0f14; --panel:#121922; --line:#1f2a38; --txt:#e8eef5; --dim:#8fa1b5;
  --gold:#d4a843; --gold-dim:#8a6f2a; --green:#3ddc84; --red:#ff6b6b; --blue:#4aa3ff;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
  display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);
  background:var(--panel);flex:none}
header img{width:34px;height:34px;border-radius:8px}
header .ttl{font-weight:700;font-size:17px}
header .sub{font-size:11px;color:var(--dim)}
#dot{margin-left:auto;width:10px;height:10px;border-radius:50%;background:var(--red);flex:none}
#dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}
main{flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:10px;
  -webkit-overflow-scrolling:touch}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;line-height:1.42;font-size:16px;
  white-space:pre-wrap;word-wrap:break-word;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.me{align-self:flex-end;background:#1d3a5f;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.sys{align-self:center;background:none;color:var(--dim);font-size:12.5px;padding:4px}
.step{align-self:flex-start;font-size:12.5px;color:var(--gold);background:#1a1608;border:1px solid #3a2f10;
  padding:6px 10px;border-radius:10px}
footer{flex:none;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--panel);
  border-top:1px solid var(--line)}
#composer{display:flex;align-items:center;gap:10px}
#txt{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:22px;
  padding:12px 16px;font-size:16px;outline:none;min-width:0}
#txt:focus{border-color:var(--gold-dim)}
#send{width:46px;height:46px;border-radius:50%;border:none;background:var(--gold);color:#111;
  font-size:19px;flex:none;cursor:pointer}
#micWrap{display:flex;justify-content:center;padding-top:10px}
#mic{width:76px;height:76px;border-radius:50%;border:2px solid var(--gold-dim);background:#1a1608;
  color:var(--gold);font-size:30px;cursor:pointer;transition:all .15s;touch-action:none;
  user-select:none;-webkit-user-select:none}
#mic.rec{background:#3d0f0f;border-color:var(--red);color:var(--red);transform:scale(1.08);
  box-shadow:0 0 24px rgba(255,107,107,.4)}
#micHint{text-align:center;font-size:11.5px;color:var(--dim);padding-top:6px}
#thinking{align-self:flex-start;color:var(--dim);font-size:14px;padding:8px 14px;display:none}
#thinking.on{display:block}
audio{display:none}
#tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.tab{flex:1;background:none;border:none;color:var(--dim);font-size:15px;font-weight:600;padding:10px;cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--gold);border-bottom-color:var(--gold)}
#live{flex:1;overflow-y:auto;display:flex;flex-direction:column}
#liveNow{flex:none;padding:12px 16px;font-size:14px;color:var(--gold);background:#1a1608;border-bottom:1px solid #3a2f10}
#liveFeed{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.feedItem{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.4}
.feedItem .t{color:var(--dim);font-size:11.5px;margin-top:4px}
.feedItem.new{animation:pop .25s ease-out;border-color:var(--gold-dim)}
#liveTabs{display:flex;gap:6px;padding:8px 12px 0;flex:none}
.ltab{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--dim);border-radius:10px;font-size:13.5px;font-weight:600;padding:8px;cursor:pointer}
.ltab.on{color:var(--gold);border-color:var(--gold-dim);background:#1a1608}
#liveScreen{flex:1;display:flex;flex-direction:column;min-height:0}
#novncFrame{flex:1;border:none;background:#000;min-height:0}
#screenHint{flex:none;font-size:11px;color:var(--dim);text-align:center;padding:5px}
</style>
</head>
<body>
<header>
  <img src="/agent-avatar-256.png" alt="" onerror="this.style.display='none'">
  <div>
    <div class="ttl">Anno</div>
    <div class="sub" id="hdrSub">Truck Console</div>
  </div>
  <div id="dot"></div>
</header>
<nav id="tabs">
  <button id="tabChat" class="tab on">Chat</button>
  <button id="tabLive" class="tab">Live</button>
</nav>
<div id="live" style="display:none">
  <div id="liveTabs">
    <button id="ltFeed" class="ltab on">Feed</button>
    <button id="ltScreen" class="ltab">Screen</button>
  </div>
  <div id="liveNow">Anno is idle — ask her something.</div>
  <div id="liveFeed"></div>
  <div id="liveScreen" style="display:none">
    <iframe id="novncFrame" title="Anno's screen"></iframe>
    <div id="screenHint">Anno's live desktop — tap inside to interact. This is her actual screen.</div>
  </div>
</div>
<main id="log"></main>
<div id="thinking">Anno is thinking…</div>
<footer>
  <div id="composer">
    <input id="txt" placeholder="Type or hold the mic…" autocomplete="off" enterkeyhint="send">
    <button id="send">➤</button>
  </div>
  <div id="micWrap"><button id="mic">🎙</button></div>
  <div id="micHint">Hold to talk · release to send</div>
</footer>

<script>
const $ = id => document.getElementById(id);
const log = $('log'), txt = $('txt'), dot = $('dot'), think = $('thinking');
let TOKEN = localStorage.getItem('portal_token') || '';
let autoVoice = true;

function scrollBottom(){ log.scrollTop = log.scrollHeight; }
function addMsg(cls, text){
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  log.appendChild(d); scrollBottom(); return d;
}
function addStep(text){
  const d = document.createElement('div');
  d.className = 'step'; d.textContent = '⚙ ' + text;
  log.appendChild(d); scrollBottom();
}

async function api(path, method='GET', body){
  const r = await fetch(path, {
    method,
    headers: {'Content-Type':'application/json', ...(TOKEN ? {Authorization:'Bearer '+TOKEN} : {})},
    body: body ? JSON.stringify(body) : undefined
  });
  return r.json();
}

/* ---- Audio out: one persistent player, unlocked by first user gesture ---- */
const player = new Audio();
let audioUnlocked = false;
const SILENT = 'data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAABhgC7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7////////////////////////////////////////////////////////////////AAAAAExhdmM1OC4xMwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAC1AAAAAAABhgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//sQxAADwAABpAAAACAAADSAAAAETEFNRTMuMTAwVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//sQxDsAAANIAAAAQAAA0gAAABBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV';
function unlockAudio(){
  if (audioUnlocked) return;
  player.src = SILENT;
  player.play().then(() => { audioUnlocked = true; }).catch(() => {});
}
async function speak(text){
  if (!autoVoice || !text) return;
  try {
    const r = await fetch('/api/tts', {
      method:'POST',
      headers:{'Content-Type':'application/json', Authorization:'Bearer '+TOKEN},
      body: JSON.stringify({text: text.slice(0, 290)})
    });
    if (!r.ok){ addMsg('sys', '⚠ Voice unavailable (server TTS error)'); return; }
    const blob = await r.blob();
    player.src = URL.createObjectURL(blob);
    await player.play().catch(() => addMsg('sys', '🔇 Tap anywhere once, then try again — browser blocked the audio.'));
  } catch(e){}
}

let busy = false;
async function sendMsg(msg){
  msg = (msg || '').trim();
  if (!msg || busy) return;
  busy = true; think.classList.add('on');
  addMsg('me', msg); txt.value = '';
  try {
    const r = await api('/api/chat', 'POST', {message: msg});
    think.classList.remove('on');
    if (r.error){ addMsg('sys', '⚠ ' + r.error); busy = false; return; }
    if (r.run_id){ activeRunId = r.run_id; pollRunSteps(); }
    (r.steps || []).forEach(s => addStep(typeof s === 'string' ? s : (s.label || s.tool || 'working…')));
    addMsg('ai', r.reply || '(no reply)');
    speak(r.reply);
  } catch(e){
    think.classList.remove('on');
    addMsg('sys', '⚠ Connection dropped — try again.');
  }
  busy = false;
}

$('send').onclick = () => { unlockAudio(); sendMsg(txt.value); };
txt.addEventListener('keydown', e => { if (e.key === 'Enter'){ unlockAudio(); sendMsg(txt.value); } });
document.addEventListener('pointerdown', unlockAudio, {once: true});

/* ---- Tabs + Live display ---- */
const logEl = log, liveEl = $('live'), feedEl = $('liveFeed'), nowEl = $('liveNow');
const foot = document.querySelector('footer');
function showTab(which){
  const chat = which === 'chat';
  $('tabChat').classList.toggle('on', chat);
  $('tabLive').classList.toggle('on', !chat);
  logEl.style.display = chat ? 'flex' : 'none';
  liveEl.style.display = chat ? 'none' : 'flex';
  think.style.display = 'none';
  foot.style.display = chat ? 'block' : 'none';
  if (!chat) pollFeed();
}
$('tabChat').onclick = () => showTab('chat');
$('tabLive').onclick = () => showTab('live');

function fmtTime(ts){
  const d = new Date(ts * 1000);
  return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
}
let lastFeedTs = 0;
async function pollFeed(){
  try {
    const r = await api('/api/activity');
    const acts = (r.activity || []);
    const fresh = acts.filter(a => (a.ts || 0) > lastFeedTs);
    if (acts.length && lastFeedTs === 0){
      // first paint: newest 25
      feedEl.innerHTML = '';
      acts.slice(0, 25).reverse().forEach(a => renderFeed(a, false));
      lastFeedTs = acts[0].ts || 0;
    } else if (fresh.length){
      fresh.reverse().forEach(a => renderFeed(a, true));
      lastFeedTs = acts[0].ts || lastFeedTs;
    }
  } catch(e){}
}
function renderFeed(a, isNew){
  const d = document.createElement('div');
  d.className = 'feedItem' + (isNew ? ' new' : '');
  const icon = {quo:'📱', crm:'📋', quote:'📄', admin:'⚙️', agent:'🤖'}[a.kind || a.type] || '•';
  d.innerHTML = icon + ' ' + (a.text || '').replace(/</g, '&lt;') +
    '<div class="t">' + fmtTime(a.ts || 0) + '</div>';
  feedEl.appendChild(d);
  feedEl.scrollTop = feedEl.scrollHeight;
  while (feedEl.children.length > 60) feedEl.removeChild(feedEl.firstChild);
}
setInterval(() => { if (liveEl.style.display !== 'none' && $('liveFeed').style.display !== 'none') pollFeed(); }, 4000);

/* ---- Screen (noVNC) ---- */
let screenLoaded = false;
function showLive(which){
  const feed = which === 'feed';
  $('ltFeed').classList.toggle('on', feed);
  $('ltScreen').classList.toggle('on', !feed);
  $('liveFeed').style.display = feed ? 'flex' : 'none';
  $('liveScreen').style.display = feed ? 'none' : 'flex';
  if (!feed && !screenLoaded){
    screenLoaded = true;
    $('novncFrame').src = '/desktop/vnc.html?autoconnect=true&resize=scale&path=desktop/websockify';
  }
  if (feed) pollFeed();
}
$('ltFeed').onclick = () => showLive('feed');
$('ltScreen').onclick = () => showLive('screen');

let activeRunId = '';
async function pollRunSteps(){
  if (!activeRunId) return;
  try {
    const r = await api('/api/agent/run?id=' + activeRunId);
    const steps = r.steps || [];
    if (steps.length){
      nowEl.textContent = '⚙ ' + (typeof steps[steps.length-1] === 'string' ? steps[steps.length-1] : (steps[steps.length-1].text || steps[steps.length-1].label || 'working…'));
    }
    if (r.done){ activeRunId = ''; setTimeout(() => { if (!activeRunId) nowEl.textContent = 'Anno is idle — ask her something.'; }, 4000); }
  } catch(e){}
}
setInterval(pollRunSteps, 1500);

/* ---- Push-to-talk voice: Web Audio capture (MediaRecorder is broken on iOS) ---- */
const mic = $('mic');
let actx = null, aStream = null, aNode = null, aChunks = [], recStart = 0, recording = false;

function floatToWav(chunks, sampleRate){
  let len = 0; chunks.forEach(c => len += c.length);
  const data = new Float32Array(len);
  let off = 0; chunks.forEach(c => { data.set(c, off); off += c.length; });
  // downsample to 16k mono 16-bit
  const ratio = sampleRate / 16000;
  const outLen = Math.floor(data.length / ratio);
  const buf = new ArrayBuffer(44 + outLen * 2);
  const v = new DataView(buf);
  const wstr = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  wstr(0,'RIFF'); v.setUint32(4, 36 + outLen*2, true); wstr(8,'WAVEfmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,16000,true); v.setUint32(28,32000,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  wstr(36,'data'); v.setUint32(40, outLen*2, true);
  for (let i = 0; i < outLen; i++){
    const s = Math.max(-1, Math.min(1, data[Math.floor(i * ratio)] || 0));
    v.setInt16(44 + i*2, s * 0x7fff, true);
  }
  return new Blob([buf], {type:'audio/wav'});
}

async function startRec(e){
  e.preventDefault();
  unlockAudio();
  if (recording) return;
  try {
    aStream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true}});
    actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') await actx.resume();
    const src = actx.createMediaStreamSource(aStream);
    aNode = actx.createScriptProcessor(4096, 1, 1);
    aChunks = [];
    aNode.onaudioprocess = ev => aChunks.push(new Float32Array(ev.inputBuffer.getChannelData(0)));
    src.connect(aNode); aNode.connect(actx.destination);
    recording = true;
    recStart = Date.now();
    mic.classList.add('rec');
  } catch(e){
    addMsg('sys', '⚠ Mic blocked — allow microphone access in browser settings.');
  }
}
async function stopRec(e){
  if (e) e.preventDefault();
  if (!recording) return;
  recording = false;
  mic.classList.remove('rec');
  const dur = Date.now() - recStart;
  try { aNode.disconnect(); actx.close(); aStream.getTracks().forEach(t => t.stop()); } catch(_){}
  if (dur < 600){ addMsg('sys', '⚠ Too quick — press, talk, then let go.'); return; }
  const samples = aChunks.reduce((n, c) => n + c.length, 0);
  const blob = floatToWav(aChunks, actx.sampleRate);
  addMsg('sys', '🎤 captured ' + Math.round(blob.size/1024) + ' KB · ' + Math.round(samples/ (actx.sampleRate/1000) / 1000 * 10) / 10 + 's');
  await transcribe(blob, dur);
}
mic.addEventListener('pointerdown', startRec);
mic.addEventListener('pointerup', stopRec);
mic.addEventListener('pointerleave', stopRec);
mic.addEventListener('pointercancel', stopRec);
mic.addEventListener('contextmenu', e => e.preventDefault());

async function transcribe(blob, dur){
  if (!blob || blob.size < 500){
    addMsg('sys', '⚠ Phone recorded ' + (blob ? blob.size : 0) + ' bytes of audio — iOS blocked the capture. Try Safari instead of Chrome, or type for now.');
    return;
  }
  think.textContent = 'Transcribing…'; think.classList.add('on');
  try {
    const b64 = await new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result.split(',')[1]);
      fr.onerror = rej;
      fr.readAsDataURL(blob);
    });
    if (!b64 || b64.length < 100){ addMsg('sys', '⚠ Recording came out empty — check the browser has mic permission, and hold longer.'); think.classList.remove('on'); think.textContent='Anno is thinking…'; return; }
    const j = await api('/api/stt', 'POST', {audio_b64: b64, mime: blob.type || 'audio/webm'});
    think.classList.remove('on'); think.textContent = 'Anno is thinking…';
    if (j.text){ sendMsg(j.text); }
    else if (j.error){ addMsg('sys', '⚠ ' + j.error); }
    else addMsg('sys', '⚠ Didn\'t catch that — hold a bit longer and speak up.');
  } catch(e){
    think.classList.remove('on'); think.textContent = 'Anno is thinking…';
    addMsg('sys', '⚠ ' + (e && e.message ? e.message : String(e)));
  }
}

/* ---- Boot ---- */
(async () => {
  if (!TOKEN){
    addMsg('sys', 'Not logged in. Log in at app.anos.ca first, then come back here.');
    $('hdrSub').textContent = 'not logged in';
    return;
  }
  const me = await api('/api/me');
  if (me.error){ addMsg('sys', 'Session expired — log in at app.anos.ca again.'); return; }
  dot.classList.add('on');
  $('hdrSub').textContent = (me.business || me.name || '') + ' · online';
  addMsg('ai', "Hey — I'm with you in the truck. Hold the mic or type. Ask me about today's leads, quotes, or tell me to do something.");
})();
</script>
</body>
</html>
